---
- name: Bootstrap Linux hosts
  hosts: master:node
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Validate deployment prerequisites
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always
    - name: Read the version of an existing node
      ansible.builtin.raw: >-
        if test -f /etc/kubernetes/kubelet.conf; then
          {{ bin_dir | default('/opt/bin') }}/kubelet --version;
        fi
      register: existing_kubelet
      changed_when: false
      tags: always
    - name: Require the upgrade playbook for existing nodes
      ansible.builtin.assert:
        that:
          - existing_kubelet.stdout | trim == '' or (kubernetes_version | default('v1.37.0')) in existing_kubelet.stdout.split()
        fail_msg: Use symplegma-upgrade.yml to change an existing node's Kubernetes version.
      tags: always
  roles:
    - symplegma-os_bootstrap
  tags:
    - bootstrap

- name: Install Kubernetes components
  hosts: master:node
  vars_files:
    - defaults/main.yml
  roles:
    - role: symplegma-containerd
      tags:
        - containerd
      when: container_runtime | default("containerd") == "containerd"
    - role: symplegma-crio
      tags:
        - crio
      when: container_runtime | default("containerd") == "crio"
    - role: symplegma-cni
      tags:
        - cni
    - role: symplegma-kubernetes_hosts
      tags:
        - kubernetes_hosts

- name: Configure the control plane
  hosts: master
  vars_files:
    - defaults/main.yml
  roles:
    - role: symplegma-kubeadm/master
      tags:
        - kubeadm-master

- name: Join Linux workers
  hosts: node
  vars_files:
    - defaults/main.yml
  roles:
    - role: symplegma-kubeadm/node
      tags:
        - kubeadm-node

- name: Install the network plugin
  hosts: master
  vars_files:
    - defaults/main.yml
  roles:
    - role: symplegma-flannel
      tags: flannel
      when: cni_plugin is defined and cni_plugin == "flannel"
