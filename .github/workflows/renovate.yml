---
name: Renovate configuration

on:
  push:
    branches: [main]
    paths: ['.github/renovate.json', '.github/workflows/renovate.yml']
  pull_request:
    paths: ['.github/renovate.json', '.github/workflows/renovate.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate Renovate configuration
        # renovate: datasource=npm depName=renovate
        run: npx --yes --package=renovate@44.69.9 renovate-config-validator --strict .github/renovate.json
