[project]
name = "symplegma"
version = "0.0.0"
description = "Ansible tooling for the Symplegma Kubernetes playbooks"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ansible==14.3.1",
  "ansible-core==2.21.3",
]

[dependency-groups]
dev = [
  "ansible-lint==26.8.0",
  "pre-commit==4.6.2",
  "pre-commit-uv==4.3.0",
  "ruff==0.16.6",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "pymdown-extensions==11.0.2",
  "Pygments==2.21.0",
  "markdown-include==0.8.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["roles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
