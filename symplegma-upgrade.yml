---
- name: Validate the upgrade before changing any host
  hosts: master:node
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate deployment prerequisites
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always

    - name: Read the current API server version
      ansible.builtin.raw: >-
        {{ bin_dir | default('/opt/bin') }}/kubectl
        --kubeconfig /etc/kubernetes/admin.conf version --output=json
      delegate_to: "{{ groups['master'] | first }}"
      run_once: true
      changed_when: false
      register: upgrade_cluster_version
      tags: always

    - name: Require a supported single-minor Kubernetes upgrade
      ansible.builtin.assert:
        that:
          - target_version is version(current_version, '>=')
          - target_version.split('.')[0] == current_version.split('.')[0]
          - (target_version.split('.')[1] | int) - (current_version.split('.')[1] | int) in [0, 1]
          - (kubeadm_version | default(kubernetes_version)) == kubernetes_version
        fail_msg: >-
          Upgrade one Kubernetes minor at a time, with kubeadm and kubelet at the
          target version. Direct upgrades from the former 1.24 defaults are unsupported.
      vars:
        current_version: "{{ (upgrade_cluster_version.stdout | from_json).serverVersion.gitVersion | regex_replace('^v', '') }}"
        target_version: "{{ kubernetes_version | regex_replace('^v', '') }}"
      tags: always

    - name: Read the installed containerd version before changing any host
      ansible.builtin.raw: "{{ bin_dir | default('/opt/bin') }}/containerd --version"
      changed_when: false
      register: installed_containerd
      when: container_runtime | default('containerd') == 'containerd'
      tags: always

    - name: Require a supported containerd upgrade path
      ansible.builtin.assert:
        that:
          - target_runtime is version('2.3.0', '>=')
          - current_runtime is version(target_runtime, '<=')
          - >-
            (current_parts[0] == target_parts[0] and
             (target_parts[1] | int) - (current_parts[1] | int) in [0, 1]) or
            (current_parts[0:2] in [['1', '7'], ['2', '0']] and target_parts[0:2] == ['2', '3'])
        fail_msg: >-
          This role's native config requires containerd 2.3 or newer.
          Containerd needs its own supported upgrade path. Sequential minor
          upgrades and migrations from the 1.7 or 2.0 LTS lines to 2.3 LTS are allowed.
          Resolve runtime deprecations and back up its configuration first.
      vars:
        current_runtime: "{{ installed_containerd.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
        target_runtime: "{{ containerd_version | default('2.3.5') }}"
        current_parts: "{{ current_runtime.split('.') }}"
        target_parts: "{{ target_runtime.split('.') }}"
      when: container_runtime | default('containerd') == 'containerd'
      tags: always

- name: Refresh Linux bootstrap prerequisites
  hosts: master:node
  gather_facts: false
  any_errors_fatal: true
  roles:
    - symplegma-os_bootstrap

- name: Upgrade control plane nodes one at a time
  hosts: master
  serial: 1
  any_errors_fatal: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Upgrade this control plane node
      ansible.builtin.include_tasks: tasks/upgrade-node.yml

- name: Upgrade Linux workers one at a time
  hosts: node
  serial: 1
  any_errors_fatal: true
  vars_files:
    - defaults/main.yml
  tasks:
    - name: Upgrade this worker
      ansible.builtin.include_tasks: tasks/upgrade-node.yml

- name: Update the network plugin
  hosts: master
  vars_files:
    - defaults/main.yml
  roles:
    - role: symplegma-flannel
      when: cni_plugin | default('') == 'flannel'
